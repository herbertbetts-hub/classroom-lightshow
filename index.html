<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Sync</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #121212; color: #fff; padding: 15px; transition: background 0.08s ease; margin: 0; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .container { max-width: 320px; padding: 20px; background: rgba(0,0,0,0.7); border-radius: 16px; backdrop-filter: blur(10px); box-sizing: border-box; }
        h1 { font-size: 22px; margin: 0 0 5px 0; }
        p { font-size: 13px; color: #aaa; margin: 0 0 15px 0; }
        button { padding: 20px 40px; font-size: 20px; margin: 15px 0; border-radius: 12px; border: none; cursor: pointer; font-weight: bold; width: 100%; background: #00e676; color: black; }
        #status { font-size: 18px; margin: 15px 0; color: #00e676; font-weight: bold; }
        #syncStatus { font-size: 11px; color: #777; margin-top: -8px; }
        #showStatus { font-size: 15px; margin: 12px 0 0 0; color: #fff; font-weight: bold; min-height: 20px; }
        #warn { font-size: 11px; color: #ffcc66; margin: 0 0 10px 0; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Classroom Sync</h1>
        <p>Tap activate and place near the speaker to join the synchronized light show.</p>
        <div id="warn">⚠️ This show uses flashing lights. If flashing bothers you, don't join.</div>

        <button id="startBtn">Join Show</button>
        <div id="status">Offline</div>
        <div id="syncStatus">Connecting to live settings...</div>
        <div id="showStatus"></div>
    </div>

    <!-- Firebase (compat SDK, no build step needed) -->
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
    <script src="showplayer.js"></script>

    <script>
        // ====== Firebase config (class-lightshow-2, personal account) — same in admin.html ======
        const firebaseConfig = {
            apiKey: "AIzaSyAPCJlL56ql7Is_wtkJUhVWhhuCp4mCvYM",
            authDomain: "class-lightshow-2.firebaseapp.com",
            databaseURL: "https://class-lightshow-2-default-rtdb.firebaseio.com",
            projectId: "class-lightshow-2",
            storageBucket: "class-lightshow-2.firebasestorage.app",
            messagingSenderId: "917117234336",
            appId: "1:917117234336:web:39413b4adffc9c7e112dc5"
        };
        // =========================================================================================

        let db = null, settingsRef = null, flashRef = null;
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
            settingsRef = db.ref("classroomSync/settings");
            flashRef = db.ref("classroomSync/flashTrigger");
        } catch (e) {
            console.log("Firebase init failed: " + e.message);
        }

        let track = null;
        let joined = false;
        let wakeLock = null;

        // Local defaults — overridden live by whatever the admin broadcasts
        let activeColor = "#00ffcc";
        let flashDuration = 80;
        let musicTrackingEnabled = true;

        // ---- Pre-programmed show player (cue list + shared clock) ----
        let player = null;
        if (db && window.LightShow) {
            player = LightShow.create({
                db: db,
                idleBg: "#121212",
                setTorch: (on) => setFlashlight(on),
                getFlashDuration: () => flashDuration,
                onStatus: (s) => {
                    if (!joined) return;
                    const el = document.getElementById('showStatus');
                    if (s.state === 'countdown') el.innerText = "🎬 Starting in " + s.startsIn + "…";
                    else if (s.state === 'playing') el.innerText = "🎵 " + (s.title || "Show") + " — playing";
                    else if (s.state === 'paused') el.innerText = "⏸ Paused";
                    else el.innerText = "";
                }
            });
        }

        // Keep the screen awake once joined (the show can't run if the phone locks)
        async function keepAwake() {
            try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
        }
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && joined) keepAwake();
        });

        // Subscribe to live settings (color, duration, on/off) from the admin console
        if (settingsRef) {
            settingsRef.on("value", (snapshot) => {
                const data = snapshot.val();
                if (!data) return;
                if (typeof data.activeColor === "string") activeColor = data.activeColor;
                if (typeof data.flashDuration === "number") flashDuration = data.flashDuration;
                if (typeof data.musicTrackingEnabled === "boolean") musicTrackingEnabled = data.musicTrackingEnabled;
                document.getElementById('syncStatus').innerText = "Live settings connected ✓";
            }, (err) => {
                document.getElementById('syncStatus').innerText = "Sync error — using local defaults";
            });
        } else {
            document.getElementById('syncStatus').innerText = "No live sync — using local defaults";
        }

        // Subscribe to the admin's "flash now" broadcast — every phone reacts to the SAME signal
        let skippedInitialFlash = false;
        if (flashRef) {
            flashRef.on("value", () => {
                if (!skippedInitialFlash) { skippedInitialFlash = true; return; } // don't flash on first connect
                if (player && player.isPlaying()) return; // a pre-programmed show is running — ignore live flashes
                if (musicTrackingEnabled) executeFlash();
            });
        }

        function afterJoin() {
            joined = true;
            keepAwake();
            if (player) player.enable();
        }

        document.getElementById('startBtn').addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                track = stream.getVideoTracks()[0];
                document.getElementById('startBtn').style.display = 'none';
                document.getElementById('status').innerText = "🕺 SYNCED!";
            } catch (err) {
                document.getElementById('startBtn').style.display = 'none';
                document.getElementById('status').innerText = "📺 SCREEN SYNC ACTIVE!";
            }
            afterJoin();
        });

        function executeFlash() {
            // Safety: never more than ~3 flashes per second, whatever the admin sends
            const p = performance.now();
            if (p - (window.__lsLastFlash || -1e9) < 340) return;
            window.__lsLastFlash = p;
            document.body.style.background = activeColor;
            setFlashlight(true);
            setTimeout(() => { setFlashlight(false); document.body.style.background = "#121212"; }, flashDuration);
        }

        async function setFlashlight(turnOn) {
            if (!track) return;
            try { await track.applyConstraints({ advanced: [{ torch: turnOn }] }); } catch (e) {}
        }
    </script>
</body>
</html>
